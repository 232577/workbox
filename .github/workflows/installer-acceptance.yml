name: WorkBox installer acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Draft candidate release tag
        required: true
        type: string
      source_sha:
        description: Reviewed source commit used to build the candidate
        required: true
        type: string
      installer_sha256:
        description: Independently measured installer SHA-256
        required: true
        type: string
      previous_tag:
        description: Previous public stable release
        required: true
        default: v1.0.0.20261112.2
        type: string
      annotate_tag:
        description: Create the annotated tag after acceptance, leaving the release as a draft
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  download:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Draft releases require push access. This job never executes installers.
      contents: write
    env:
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      INSTALLER_SHA: ${{ inputs.installer_sha256 }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download draft bytes without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$INSTALLER_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v1\.0\.0\.20[0-9]{6}(\.[1-9][0-9]{0,3})?$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v1\.0\.0\.20[0-9]{6}(\.[1-9][0-9]{0,3})?$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          mkdir -p .local/installer-inputs/candidate .local/installer-inputs/previous
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir .local/installer-inputs/candidate --pattern '*.exe' --pattern BUILD_PROVENANCE.json --pattern PACKAGE_CONTENTS.sha256
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --dir .local/installer-inputs/previous --pattern '*.exe'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIOUS_TAG" > .local/installer-inputs/previous/release.json
          files=(.local/installer-inputs/candidate/*.exe)
          [[ ${#files[@]} == 1 ]]
          printf '%s  %s\n' "$INSTALLER_SHA" "${files[0]}" | sha256sum --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-inputs
          path: .local/installer-inputs/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    needs: download
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      INSTALLER_SHA: ${{ inputs.installer_sha256 }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-inputs
          path: .local/installer-inputs
      - name: Run exact installer upgrade and uninstall with anonymous data
        shell: pwsh
        run: |
          python -m scripts.verify_installer_windows --candidate-dir .local/installer-inputs/candidate --previous-dir .local/installer-inputs/previous --expected-tag $env:CANDIDATE_TAG --previous-tag $env:PREVIOUS_TAG --expected-sha $env:INSTALLER_SHA --expected-source $env:SOURCE_SHA --output .local/installer-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Installer acceptance failed' }
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-acceptance
          path: |
            .local/installer-acceptance/*.json
            .local/installer-acceptance/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  annotate_tag:
    needs: verify
    if: >-
      inputs.annotate_tag && needs.verify.result == 'success' &&
      github.repository == '232577/workbox' && github.ref == 'refs/heads/main' &&
      github.actor == '232577'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Verify draft identity and create an annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          INSTALLER_SHA: ${{ inputs.installer_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$INSTALLER_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v1\.0\.0\.(20[0-9]{6})(\.([1-9][0-9]{0,3}))?$ ]]
          date="${BASH_REMATCH[1]}"
          revision="${BASH_REMATCH[3]:-}"
          filename="WorkBox-1.0.0-Setup-x64-$date${revision:+-r$revision}.exe"
          repo="repos/$GITHUB_REPOSITORY"
          ref="refs/tags/$CANDIDATE_TAG"

          gh api --paginate "$repo/releases?per_page=100" |
            jq -es --arg tag "$CANDIDATE_TAG" --arg file "$filename" --arg digest "sha256:$INSTALLER_SHA" '
              [.[][] | select(.tag_name == $tag)] |
              length == 1 and (.[0] | .draft == true and .prerelease == false and
                ([.assets[] | select(.name | ascii_downcase | endswith(".exe"))] |
                 length == 1 and (.[0] | .name == $file and .state == "uploaded" and .digest == $digest)))
            ' > /dev/null

          # Only a successful list of refs can establish the absence of the exact name.
          matches=$(gh api "$repo/git/matching-refs/tags/$CANDIDATE_TAG" |
            jq -ce --arg ref "$ref" 'select(type == "array") | [.[] | select(.ref == $ref)]')
          if [[ "$matches" != '[]' ]]; then
            existing=$(jq -er 'select(length == 1 and .[0].object.type == "tag") |
              .[0].object.sha | select(test("^[0-9a-f]{40}$"))' <<< "$matches")
            gh api "$repo/git/tags/$existing" |
              jq -e --arg tag "$CANDIDATE_TAG" --arg source "$SOURCE_SHA" --arg object "$existing" '
                .tag == $tag and .sha == $object and .object.type == "commit" and .object.sha == $source
              ' > /dev/null
            printf 'Verified existing annotated tag %s at %s\n' "$CANDIDATE_TAG" "$SOURCE_SHA"
            exit 0
          fi

          message=$(printf 'WorkBox %s\n\nInstaller SHA-256: %s\nInstaller acceptance run: %s\n' \
            "$CANDIDATE_TAG" "$INSTALLER_SHA" "$GITHUB_RUN_ID")
          object=$(gh api --method POST "$repo/git/tags" -f tag="$CANDIDATE_TAG" \
            -f message="$message" -f object="$SOURCE_SHA" -f type=commit \
            -f 'tagger[name]=github-actions[bot]' \
            -f 'tagger[email]=41898282+github-actions[bot]@users.noreply.github.com' |
            jq -er --arg tag "$CANDIDATE_TAG" --arg source "$SOURCE_SHA" '
              select(.tag == $tag and .object.type == "commit" and .object.sha == $source) |
              .sha | select(test("^[0-9a-f]{40}$"))
            ')
          gh api --method POST "$repo/git/refs" -f ref="$ref" -f sha="$object" --silent
          gh api "$repo/git/ref/tags/$CANDIDATE_TAG" |
            jq -e --arg ref "$ref" --arg object "$object" '
              .ref == $ref and .object.type == "tag" and .object.sha == $object
            ' > /dev/null
          printf 'Created annotated tag %s at %s\n' "$CANDIDATE_TAG" "$SOURCE_SHA"
