name: WorkBox installer acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Draft candidate release tag
        required: true
        type: string
      source_sha:
        description: Reviewed source commit used to build the candidate
        required: true
        type: string
      installer_sha256:
        description: Independently measured installer SHA-256
        required: true
        type: string
      previous_tag:
        description: Previous public stable release
        required: true
        default: v1.0.0.20261112.2
        type: string

permissions:
  contents: read

jobs:
  download:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Draft releases require push access. This job never executes installers.
      contents: write
    env:
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      INSTALLER_SHA: ${{ inputs.installer_sha256 }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Download draft bytes without executing them
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ && "$INSTALLER_SHA" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^v1\.0\.0\.20[0-9]{6}(\.[1-9][0-9]{0,3})?$ ]]
          [[ "$PREVIOUS_TAG" =~ ^v1\.0\.0\.20[0-9]{6}(\.[1-9][0-9]{0,3})?$ ]]
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          mkdir -p .local/installer-inputs/candidate .local/installer-inputs/previous
          gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir .local/installer-inputs/candidate --pattern '*.exe' --pattern BUILD_PROVENANCE.json --pattern PACKAGE_CONTENTS.sha256
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --dir .local/installer-inputs/previous --pattern '*.exe'
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$PREVIOUS_TAG" > .local/installer-inputs/previous/release.json
          files=(.local/installer-inputs/candidate/*.exe)
          [[ ${#files[@]} == 1 ]]
          printf '%s  %s\n' "$INSTALLER_SHA" "${files[0]}" | sha256sum --check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-inputs
          path: .local/installer-inputs/
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  verify:
    needs: download
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      INSTALLER_SHA: ${{ inputs.installer_sha256 }}
      PREVIOUS_TAG: ${{ inputs.previous_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-inputs
          path: .local/installer-inputs
      - name: Run exact installer upgrade and uninstall with anonymous data
        shell: pwsh
        run: |
          python -m scripts.verify_installer_windows --candidate-dir .local/installer-inputs/candidate --previous-dir .local/installer-inputs/previous --expected-tag $env:CANDIDATE_TAG --previous-tag $env:PREVIOUS_TAG --expected-sha $env:INSTALLER_SHA --expected-source $env:SOURCE_SHA --output .local/installer-acceptance
          if ($LASTEXITCODE -ne 0) { throw 'Installer acceptance failed' }
      - name: Retain acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-acceptance
          path: |
            .local/installer-acceptance/*.json
            .local/installer-acceptance/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
