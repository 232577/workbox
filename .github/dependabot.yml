version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Shanghai
    # One reviewed routine-maintenance PR, not one PR per action.
    # This applies only to version updates; security alerts are not disabled.
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ['*']
    open-pull-requests-limit: 1
